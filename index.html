<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090a10">
<title>Viral World V3</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#090a10;--panel:#15161f;--line:#2b2d3a;--text:#f5f6fb;--muted:#a2a4b2;--blue:#168bff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 100% 10%,#241a35 0,transparent 32%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;padding-bottom:85px}.app{max-width:720px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:20px}.logo{width:45px;height:45px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(140deg,#ffb43d,#ff407d,#8050ff);font-size:25px}.btn{background:#22242e;border:1px solid var(--line);border-radius:13px;color:var(--text);padding:10px 13px;font-weight:800}.hero{padding:8px 0 18px}.eyebrow{font-size:10px;letter-spacing:2px;color:#69b5ff;font-weight:900}h1{font-size:35px;margin:6px 0}.sub{color:var(--muted);font-size:13px}.search{display:block;width:100%;padding:15px 16px;border-radius:16px;border:1px solid var(--line);background:#1b1d27;color:var(--text);outline:none;margin-bottom:14px}.chips{display:flex;gap:8px;overflow:auto;padding:0 0 15px}.chip{border:1px solid var(--line);background:#171821;color:var(--muted);border-radius:30px;padding:9px 15px;white-space:nowrap}.chip.active{background:linear-gradient(120deg,#168bff,#285fff);color:white;border-color:transparent}.status{font-size:11px;color:var(--muted);margin:0 0 12px}.feed{display:grid;gap:15px}.card{padding:11px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(140deg,#171922,#111219);overflow:hidden}.media{height:225px;border-radius:17px;overflow:hidden;background:linear-gradient(135deg,#253d65,#75365b);position:relative;display:grid;place-items:center}.media img,.media video{width:100%;height:100%;object-fit:cover}.placeholder{font-size:44px}.tag{position:absolute;top:11px;left:11px;background:#090a10d9;padding:7px 10px;border-radius:20px;font-size:10px;font-weight:900}.title{font-size:18px;line-height:1.5;margin:12px 3px 8px;overflow-wrap:anywhere}.meta{font-size:11px;color:var(--muted);margin:0 3px 13px}.actions{display:flex;gap:9px}.actions a,.actions button{flex:1;text-align:center;text-decoration:none;background:linear-gradient(120deg,#31a5ff,#096aff);color:#fff;border-radius:14px;padding:13px 8px;font-size:12px;font-weight:900;border:0}.actions .secondary{background:#282832;border:1px solid #3a3b46}.empty{text-align:center;padding:35px 15px;border:1px dashed #3a3b48;border-radius:20px;color:var(--muted)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,720px);display:grid;grid-template-columns:repeat(4,1fr);padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:#11121af2;backdrop-filter:blur(20px);border-top:1px solid var(--line)}.nav button{background:none;color:#8c8e9b;border:0;padding:7px 2px;font-size:10px;font-weight:800}.nav button span{display:block;font-size:20px;margin-bottom:3px}.nav button.active{color:#53aaff}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#f7f8fc;color:#171821;padding:11px 16px;border-radius:12px;font-size:12px;font-weight:800;display:none}.toast.show{display:block}@media(min-width:560px){.media{height:285px}}
</style></head>
<body>
<main class="app">
<header class="top"><div class="brand"><div class="logo">♛</div>Viral World <small style="font-size:10px;color:#69b5ff">V3</small></div><button class="btn" id="refresh">↻ Refresh</button></header>
<section class="hero"><div class="eyebrow">TELEGRAM · LIVE FEED</div><h1>Discover</h1><p class="sub">আপনার Telegram চ্যানেলের নতুন পোস্ট এখানে স্বয়ংক্রিয়ভাবে আসবে।</p></section>
<input id="search" class="search" placeholder="ভিডিও বা পোস্ট খুঁজুন…" autocomplete="off">
<nav class="chips" id="chips"><button class="chip active" data-cat="All">All</button><button class="chip" data-cat="Telegram">Telegram</button><button class="chip" data-cat="Video">Video</button><button class="chip" data-cat="Photo">Photo</button></nav>
<p class="status" id="status">ফিড লোড হচ্ছে…</p><section class="feed" id="feed"></section>
</main>
<nav class="nav"><button class="active" data-page="Home"><span>⌂</span>Home</button><button data-page="Search"><span>⌕</span>Search</button><button data-page="Telegram"><span>➤</span>Telegram</button><button data-page="Profile"><span>♙</span>About</button></nav>
<div class="toast" id="toast"></div>
<script>
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#090a10');tg.setBackgroundColor('#090a10')}catch(e){}}
const initData=tg&&tg.initData?tg.initData:'';let allPosts=[],category='All',lastConfig={};
const $=id=>document.getElementById(id);
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1900)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path){const r=await fetch(path,{headers:initData?{'X-Telegram-Init-Data':initData}:{}});if(!r.ok)throw Error('API '+r.status);return r.json()}
function fileUrl(id){return '/api/telegram-file/'+encodeURIComponent(id)}
function render(){const q=$('search').value.trim().toLowerCase();const list=allPosts.filter(p=>(category==='All'||(category==='Telegram')||(category==='Video'&&p.hasVideo)||(category==='Photo'&&p.hasPhoto))&&(String(p.title)+' '+String(p.text||'')).toLowerCase().includes(q));$('status').textContent=`${list.length} posts · ${lastConfig.channelUrl?'Channel connected':'Telegram feed'}`;if(!list.length){$('feed').innerHTML='<div class="empty">এখনো কোনো পোস্ট নেই।<br>বটকে চ্যানেলের admin করুন এবং নতুন পোস্ট দিন।</div>';return}
$('feed').innerHTML=list.map(p=>{let media='';if(p.imageFileId)media=`<img loading="lazy" src="${fileUrl(p.imageFileId)}" alt="Telegram photo">`;else if(p.videoFileId)media=`<div class="placeholder">▶️</div>`;else media='<div class="placeholder">➤</div>';return `<article class="card"><div class="media">${media}<span class="tag">${p.hasVideo?'VIDEO':p.hasPhoto?'PHOTO':'TELEGRAM'}</span></div><h2 class="title">${esc(p.title||'Telegram post')}</h2><p class="meta">${esc(new Date(p.date).toLocaleString())}</p><div class="actions">${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">➤ Open in Telegram</a>`:`<button class="secondary" disabled>Telegram post</button>`}<button class="secondary" data-copy="${esc(p.url||'')}">Copy Link</button></div></article>`}).join('')}
async function load(){try{const [data,config]=await Promise.all([api('/api/posts?limit=100'),api('/api/config')]);allPosts=data.posts||[];lastConfig=config;$('status').textContent='Feed updated · '+new Date().toLocaleTimeString();render()}catch(e){$('status').textContent='সার্ভারের সঙ্গে সংযোগ হচ্ছে না। হোস্টিং ও backend চালু আছে কি না দেখুন।';$('feed').innerHTML='<div class="empty">ফিড লোড হয়নি। একটু পরে Refresh চাপুন।</div>'}}
$('refresh').onclick=load;$('search').addEventListener('input',render);$('chips').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;category=b.dataset.cat;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});
$('feed').addEventListener('click',async e=>{const b=e.target.closest('[data-copy]');if(!b)return;const url=b.dataset.copy;if(!url)return toast('এই পোস্টের public link নেই');try{await navigator.clipboard.writeText(url);toast('লিংক কপি হয়েছে')}catch(_){toast(url)}});
document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.page==='Search')$('search').focus();else if(b.dataset.page==='Telegram'){if(lastConfig.channelUrl)window.open(lastConfig.channelUrl,'_blank','noopener');else toast('Channel username server .env-এ সেট করুন')}else if(b.dataset.page==='Profile')toast('Viral World V3 · Telegram Mini App')});
load();setInterval(load,30000);
</script></body></html>
